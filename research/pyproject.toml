[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "moira-research"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = ["torch>=2.4", "numpy>=1.26"]

[project.optional-dependencies]
test = ["pytest>=8"]
training = [
    "accelerate>=1.14,<2",
    "datasets>=5,<6",
    "peft>=0.20,<0.21",
    "safetensors>=0.8,<0.9",
    "torchao>=0.18,<0.19",
    "transformers>=5.15,<6",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.hatch.build.targets.wheel]
packages = ["src/moira"]
