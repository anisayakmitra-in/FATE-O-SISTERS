schema_version = 1

[model]
vocab_size = 8192
d_model = 512
n_layers = 12
n_heads = 8
ffn_dim = 1024
thread_radius = 8
spool_rank = 32
knot_slots = 16
capsule_width = 64
max_seq_len = 64
causal_knot_policy = "fixed-complete-chunks-v1"
dropout = 0.0
tie_embeddings = true
expected_trainable_parameters = 33032562

[data]
kind = "synthetic-indexed-v1"
seed = 13031997
train_split = 0
eval_split = 1
batch_size = 1

[optimization]
optimizer = "adamw"
learning_rate = 0.0003
weight_decay = 0.01
gradient_accumulation_steps = 1
schedule = "cosine-with-warmup"
warmup_steps = 10
schedule_total_steps = 100
# INT8 is the fake-quantized forward view; training retains FP32 master weights.
precision = "fp32"
clip_grad_norm = 1.0

[reproducibility]
seed = 20260824
deterministic = "strict"

[run]
log_every_steps = 1
checkpoint_every_steps = 10
keep_last_checkpoints = 2
